<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Skillaz · план Q4 2026</title>
  <link rel="icon" href="../skillaz-logo.png">
  <link rel="stylesheet" href="q4.css?v=20260928-11">
  <link rel="stylesheet" href="q4-enhancements.css?v=20260928-11">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../"><img src="../skillaz-logo.png" alt="Skillaz"><span><strong>План Q4 2026</strong><small id="updatedAt"></small></span></a>
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="Режим просмотра">
      <button type="button" data-mode="internal">Внутренний</button><button type="button" data-mode="client">Для клиентов</button>
    </div>
    <button class="share-button" id="shareButton" type="button">Скопировать ссылку для клиента</button>
  </header>
  <main>
    <section class="intro">
      <div><span class="eyebrow" id="eyebrow"></span><h1 id="pageTitle"></h1><p id="pageLead"></p></div>
      <div class="summary" id="summary"></div>
    </section>
    <p class="delivery-note" id="deliveryNote"></p>
    <section class="controls internal-only">
      <div class="team-tabs" id="teamTabs"></div>
      <div class="scope-tabs" id="scopeTabs"><button type="button" data-scope="all">Все</button><button type="button" data-scope="product">Продукт</button><button type="button" data-scope="project">Клиент</button></div>
    </section>
    <section class="team-panel internal-only">
      <div class="team-copy"><span class="section-label">Фокус команды</span><h2 id="teamTitle"></h2><p id="teamMission"></p><a class="dashboard-link" id="teamDashboard" target="_blank" rel="noreferrer">Открыть доску команды</a></div>
      <div class="capacity" id="capacity"></div><div class="team-stats" id="teamStats"></div>
    </section>
    <section class="notices internal-only" id="notices"></section>
    <section class="roadmap">
      <header class="roadmap-head">
        <div><span class="section-label">Октябрь — январь</span><h2 id="roadmapTitle"></h2></div>
        <div class="roadmap-tools"><label class="search"><span>Поиск</span><input id="searchInput" type="search" placeholder="По названию или модулю"></label><div class="module-filter" id="moduleFilter"></div></div>
      </header>
      <div class="months" id="months"></div>
    </section>
    <section class="discovery"><header><span class="section-label">Следующий горизонт</span><h2>Discovery для следующего этапа</h2></header><div class="discovery-grid" id="discoveryGrid"></div></section>
  </main>
  <div class="modal-shell" id="modalShell" aria-hidden="true">
    <button class="modal-backdrop" id="modalBackdrop" aria-label="Закрыть"></button>
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Закрыть">×</button>
      <header class="modal-header"><div class="modal-meta" id="modalMeta"></div><h2 id="modalTitle"></h2><p id="modalSummary"></p></header>
      <div class="gallery" id="gallery"></div>
      <section class="modal-section"><h3 id="scopeTitle">Что входит</h3><div class="task-list" id="taskList"></div></section>
    </article>
  </div>
  <div class="image-viewer" id="imageViewer" aria-hidden="true">
    <button class="image-viewer-backdrop" id="imageViewerBackdrop" type="button" aria-label="Закрыть изображение"></button>
    <button class="image-viewer-close" id="imageViewerClose" type="button" aria-label="Закрыть изображение">×</button>
    <img id="imageViewerImage" alt="Увеличенный макет">
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="q4-data.js?v=20260929-1"></script><script src="q4.js?v=20260929-1"></script>
</body>
</html>
